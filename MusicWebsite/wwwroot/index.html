<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>My Music Website</title>

    <style>
        body {
            background-color: #6a5acd;
            font-family: Arial;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .video {
            width: 320px;
            height: 560px;
            margin: auto;
            border-radius: 15px;
            overflow: hidden;
        }

        .box {
            width: 90%;
            height: 150px;
            background: black;
            margin: 30px auto;
            position: relative;
            border-radius: 10px;
        }

        #note {
            font-size: 50px;
            position: absolute;
            left: 10px;
            top: 40px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>My Favorite Song 🎶</h1>

    <div class="video">
        <iframe width="100%" height="100%"
                src="https://www.youtube.com/embed/J1mR9BfyGuY"
                allowfullscreen>
        </iframe>
    </div>

    <h2>JavaScript Animation</h2>

    <div class="box">
        <div id="note">♪</div>
    </div>

    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>

    <script>
        let x = 10;
        let timer = null;
        const note = document.getElementById("note");

        function moveNote() {
            x += 5;
            if (x > 300) x = 10;
            note.style.left = x + "px";
        }

        document.getElementById("startBtn").addEventListener("click", function () {
            if (timer !== null) return;     // already running
            timer = setInterval(moveNote, 50);
        });

        document.getElementById("stopBtn").addEventListener("click", function () {
            clearInterval(timer);
            timer = null;
        });
    </script>

</body>
</html>
